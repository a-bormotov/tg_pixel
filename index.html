<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Event Leaderboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1d2739;
      color: #d0d8e0;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    table {
      margin: auto;
      border-collapse: collapse;
      width: 95%;
      background: #263249;
      color: #fff;
      font-size: 14px;
    }
    th, td {
      padding: 8px 10px;
      border: 1px solid #3a475f;
    }
    th {
      background: #31405a;
      position: sticky;
      top: 0;
      z-index: 2;
    }
    tr:nth-child(even) { background: #2c3a54; }
  </style>
</head>
<body>

<h1>Event Leaderboard</h1>

<table id="leaderboard">
  <thead>
    <tr>
      <th>Rank</th>
      <th>Username</th>
      <th>Score</th>
      <th>PurpleStones</th>
      <th>Cards rare</th>
      <th>Cards epic</th>
      <th>Cards legendary</th>
      <th>NFT</th>
      <th>PIXEL</th>
      <th>PIXEL USD</th>
      <th>FISH (in USD)</th>
      <th>Total USD</th>
      <th>userId</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
async function fetchText(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error("Failed to load " + url);
  return await res.text();
}

function parseCsv(text) {
  const lines = text.trim().split(/\r?\n/);
  if (!lines.length) return [];
  const header = lines[0].split(",").map(h => h.trim());
  return lines.slice(1).map(line => {
    if (!line.trim()) return null;
    const parts = line.split(",");
    const row = {};
    header.forEach((h, i) => row[h] = (parts[i] || "").trim());
    return row;
  }).filter(Boolean);
}

async function loadLeaderboard() {
  const resultRows = parseCsv(await fetchText("old_result_data.csv"));
  const nftRows    = parseCsv(await fetchText("nft_data.csv"));
  const pixelRows  = parseCsv(await fetchText("pixel.csv"));
  const fishRows   = parseCsv(await fetchText("fish.csv"));

  // Index NFT by userId
  const nftByUserId = {};
  nftRows.forEach(r => {
    if (r.userId) nftByUserId[r.userId] = r.multiplier || "-";
  });

  // Index PIXEL by Rank
  const pixelByRank = {};
  pixelRows.forEach(r => {
    const rank = parseInt(r.Rank, 10);
    if (!rank) return;
    pixelByRank[rank] = {
      pixel: r.PIXEL || "",
      usd:   r.USD || ""
    };
  });

  // Index FISH by Rank
  const fishByRank = {};
  fishRows.forEach(r => {
    const rank = parseInt(r.Rank, 10);
    if (!rank) return;
    fishByRank[rank] = {
      usd: r.USD || ""
    };
  });

  const header = Object.keys(resultRows[0]).map(h => h.toLowerCase());
  function col(row, name, fallback="") {
    const idx = header.indexOf(name.toLowerCase());
    if (idx !== -1) return row[Object.keys(row)[idx]];
    return fallback ? row[fallback] : "";
  }

  const tbody = document.querySelector("#leaderboard tbody");
  tbody.innerHTML = "";

  resultRows.forEach(r => {
    const rank = parseInt(col(r, "Rank"), 10) || 0;
    if (!rank) return;

    const username       = col(r, "Username");
    const score          = col(r, "Score");
    const purpleStones   = col(r, "PurpleStones", "Gold"); // пока Gold = PurpleStones
    const cardsRare      = col(r, "CardsRare");
    const cardsEpic      = col(r, "CardsEpic");
    const cardsLegendary = col(r, "CardsLegendary");
    const userId         = col(r, "userId");

    // NFT
    const nftMult = nftByUserId[userId] || "-";

    // PIXEL
    const px = pixelByRank[rank] || {};
    const pixelAmount = px.pixel || "";
    const pixelUsdRaw = px.usd || "";
    const pixelUsd = pixelUsdRaw ? parseFloat(pixelUsdRaw) : 0;

    // FISH
    const f = fishByRank[rank] || {};
    const fishUsdRaw = f.usd || "";
    const fishUsd = fishUsdRaw ? parseFloat(fishUsdRaw) : 0;

    const totalUsd = pixelUsd + fishUsd;

    const tr = document.createElement("tr");
    function td(v) {
      const c = document.createElement("td");
      c.textContent = v;
      return c;
    }

    tr.appendChild(td(rank));
    tr.appendChild(td(username));
    tr.appendChild(td(score));
    tr.appendChild(td(purpleStones));
    tr.appendChild(td(cardsRare));
    tr.appendChild(td(cardsEpic));
    tr.appendChild(td(cardsLegendary));
    tr.appendChild(td(nftMult));
    tr.appendChild(td(pixelAmount));
    tr.appendChild(td(pixelUsdRaw));
    tr.appendChild(td(fishUsdRaw));
    tr.appendChild(td(totalUsd ? totalUsd.toFixed(2) : ""));
    tr.appendChild(td(userId));

    tbody.appendChild(tr);
  });
}

loadLeaderboard().catch(err => {
  console.error("Leaderboard load failed:", err);
});
</script>

</body>
</html>
