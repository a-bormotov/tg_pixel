name: Uncharted Users export

on:
  workflow_dispatch:    # ручной запуск из GitHub UI

jobs:
  export-uncharted-users:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary sshtunnel google-api-python-client google-auth google-auth-httplib2

      - name: Run export script
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KEY_PASSWORD: ${{ secrets.SSH_KEY_PASSWORD }}

          DB1_HOST: ${{ secrets.DB1_HOST }}
          DB1_PORT: ${{ secrets.DB1_PORT }}
          DB1_NAME: ${{ secrets.DB1_NAME }}
          DB1_USER: ${{ secrets.DB1_USER }}
          DB1_PASS: ${{ secrets.DB1_PASS }}

          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_UNCHARTED_ID: ${{ secrets.GOOGLE_SHEETS_UNCHARTED_ID }}
          # опционально можешь переопределить диапазон, по умолчанию Sheet1!A1
          # GOOGLE_SHEETS_UNCHARTED_RANGE: 'Uncharted!A1'
        run: |
          python Uncharted/export_uncharted_users.py

      - name: Upload CSV artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: UnchartedUsers.csv
          path: Uncharted/UnchartedUsers.csv
          if-no-files-found: ignore
