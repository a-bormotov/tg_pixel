name: Run Uncharted Users export

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  uncharted-users:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg2-binary==2.9.9" "sshtunnel==0.4.0" "paramiko==2.12.0"
          pip install google-api-python-client google-auth google-auth-httplib2

      - name: Run Uncharted export (DB1 -> UnchartedUsers.csv + Google Sheets)
        env:
          # SSH
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY:  ${{ secrets.SSH_KEY }}
          SSH_KEY_PASSWORD: ${{ secrets.SSH_KEY_PASSWORD }}

          # DB1
          DB1_HOST: ${{ secrets.DB1_HOST }}
          DB1_PORT: ${{ secrets.DB1_PORT }}
          DB1_NAME: ${{ secrets.DB1_NAME }}
          DB1_USER: ${{ secrets.DB1_USER }}
          DB1_PASS: ${{ secrets.DB1_PASS }}

          # Google Sheets
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_UNCHARTED_ID:  ${{ secrets.GOOGLE_SHEETS_UNCHARTED_ID }}
          # опционально: можно переопределить лист/диапазон
          # GOOGLE_SHEETS_UNCHARTED_RANGE: 'Uncharted!A1'

          # SQL (если хочешь явно)
          SQL_FILE: "Uncharted/data.sql"
        run: python Uncharted/export_uncharted_users.py

      - name: Commit Uncharted CSV
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Uncharted/UnchartedUsers.csv
          if git diff --staged --quiet; then
            echo "No changes — skip commit/push."
            exit 0
          fi
          git commit -m "Update UnchartedUsers.csv [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
