name: Run DB2 Probe SQL

on:
  workflow_dispatch: {}

jobs:
  run-sql:
    runs-on: ubuntu-latest

    # пробрасываем секреты в env на уровне job
    env:
      # DB2
      DB2_HOST: ${{ secrets.DB2_HOST }}
      DB2_PORT: ${{ secrets.DB2_PORT }}
      DB2_NAME: ${{ secrets.DB2_NAME }}
      DB2_USER: ${{ secrets.DB2_USER }}
      DB2_PASSWORD: ${{ secrets.DB2_PASSWORD }}
      # SSH2
      USE_SSH_DB2: ${{ secrets.USE_SSH_DB2 }}
      SSH2_HOST: ${{ secrets.SSH2_HOST }}
      SSH2_PORT: ${{ secrets.SSH2_PORT }}
      SSH2_USER: ${{ secrets.SSH2_USER }}
      SSH2_KEY_PASSWORD: ${{ secrets.SSH2_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install psycopg2-binary==2.9.9 sshtunnel==0.4.0

      - name: Prepare SSH2 key (only if USE_SSH_DB2)
        if: ${{ env.USE_SSH_DB2 == 'true' || env.USE_SSH_DB2 == '1' || env.USE_SSH_DB2 == 'yes' }}
        run: |
          if [ -z "${{ secrets.SSH2_PRIVATE_KEY }}" ]; then
            echo "ERROR: SSH2_PRIVATE_KEY is empty but USE_SSH_DB2 is set."
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH2_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          printf "Host *\n\tStrictHostKeyChecking no\n\tUserKnownHostsFile=/dev/null\n" >> ~/.ssh/config

      - name: Run probe (DB2)
        env:
          # DB2
          DB2_HOST: ${{ env.DB2_HOST }}
          DB2_PORT: ${{ env.DB2_PORT }}
          DB2_NAME: ${{ env.DB2_NAME }}
          DB2_USER: ${{ env.DB2_USER }}
          DB2_PASSWORD: ${{ env.DB2_PASSWORD }}
          # SSH2
          USE_SSH_DB2: ${{ env.USE_SSH_DB2 }}
          SSH2_HOST: ${{ env.SSH2_HOST }}
          SSH2_PORT: ${{ env.SSH2_PORT }}
          SSH2_USER: ${{ env.SSH2_USER }}
          SSH2_KEY_PATH: /home/runner/.ssh/id_rsa
          SSH2_KEY_PASSWORD: ${{ env.SSH2_KEY_PASSWORD }}
        run: python run_db2_probe.py

      - name: Commit raw_data.csv
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw_data.csv
          git commit -m "DB2 probe: update raw_data.csv [skip ci]" || echo "No changes"
          git push
