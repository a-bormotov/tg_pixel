name: Run SQL and export CSV

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 * * * *'   # каждый час по UTC

permissions:
  contents: write

jobs:
  run-query:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (pin compat)
        run: |
          python -m pip install --upgrade pip
          # Совместимые версии (исключаем DSSKey-конфликт)
          pip install "psycopg2-binary==2.9.9" "sshtunnel==0.4.0" "paramiko==2.12.0"

      - name: Run DB2 probe
        env:
          # --- SSH включение ---
          USE_SSH_DB2: "true"

          # --- SSH2 (как в твоих секретах: ключ строкой) ---
          SSH2_HOST: ${{ secrets.SSH2_HOST }}
          SSH2_PORT: ${{ secrets.SSH2_PORT }}
          SSH2_USER: ${{ secrets.SSH2_USER }}
          SSH2_PRIVATE_KEY: ${{ secrets.SSH2_PRIVATE_KEY }}
          SSH2_KEY_PASSWORD: ${{ secrets.SSH2_KEY_PASSWORD }}

          # --- DB2 (как её видит SSH-хост) ---
          DB2_HOST: ${{ secrets.DB2_HOST }}
          DB2_PORT: ${{ secrets.DB2_PORT }}
          DB2_NAME: ${{ secrets.DB2_NAME }}
          DB2_USER: ${{ secrets.DB2_USER }}
          DB2_PASSWORD: ${{ secrets.DB2_PASSWORD }}

          # --- файлы ---
          SQL_FILE: db2_probe.sql
          OUTPUT_CSV: raw_data.csv
        run: python run_db2_probe.py

      - name: Commit CSVs
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add raw_data.csv
          if git diff --staged --quiet; then
            echo "No changes — skip commit/push."
            exit 0
          fi

          git commit -m "Update raw_data.csv [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
