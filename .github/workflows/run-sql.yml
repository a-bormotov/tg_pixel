name: Run NFT Points event

on:
  workflow_dispatch: {}
  schedule:
    - cron: "55 * * * *"

permissions:
  contents: write

jobs:
  run-query:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (pinned)
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg2-binary==2.9.9" "sshtunnel==0.4.0" "paramiko==2.12.0"

      - name: Run pipeline (events -> raw_data.csv, usernames -> result_data.csv)
        env:
          # SSH
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY:  ${{ secrets.SSH_KEY }}
          SSH_KEY_PASSWORD: ${{ secrets.SSH_KEY_PASSWORD }}

          # DB1 (users -> usernames)
          DB1_HOST: ${{ secrets.DB1_HOST }}
          DB1_PORT: ${{ secrets.DB1_PORT }}
          DB1_NAME: ${{ secrets.DB1_NAME }}
          DB1_USER: ${{ secrets.DB1_USER }}
          DB1_PASS: ${{ secrets.DB1_PASS }}

          # DB2 (events + vipHistory)
          DB2_HOST: ${{ secrets.DB2_HOST }}
          DB2_PORT: ${{ secrets.DB2_PORT }}
          DB2_NAME: ${{ secrets.DB2_NAME }}
          DB2_USER: ${{ secrets.DB2_USER }}
          DB2_PASS: ${{ secrets.DB2_PASS }}

          # files
          SQL_FILE: "data.sql"
          USER_SQL_FILE: "user_data.sql"
          OUTPUT_CSV: "raw_data.csv"
          TOP_N: "3000"
        run: python run_query.py

      - name: Commit CSVs
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw_data.csv result_data.csv
          if git diff --staged --quiet; then
            echo "No changes — skip commit/push."
            exit 0
          fi
          git commit -m "Update NFT Points event CSVs [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
